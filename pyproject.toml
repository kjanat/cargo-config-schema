[project]
name            = "cargo-config-schema"
version         = "0.1.0"
description     = "Build and validate the Cargo configuration JSON Schema"
readme          = "README.md"
requires-python = ">=3.14"
license         = "MIT"
license-files   = ["LICENSE"]
dependencies    = []

[project.scripts]
cargo-schema-bundle = "cargo_config_schema.bundle:main"
cargo-schema-check  = "cargo_config_schema.validate:main"

[dependency-groups]
dev = [
  "dprint-py>=0.57.4.0",
  "jsonschema>=4.26.0",
  "referencing>=0.37.0",
  "tombi>=1.5.5",
]

[build-system]
requires      = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cargo_config_schema"]
