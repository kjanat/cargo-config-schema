#:schema ../cargo-config.json
#:tombi schema.strict = true

paths = ["../local-crate"]

[alias]
b             = "build"
rr            = "run --release"
space_example = ["run", "--release", "--", "argument with spaces"]

[alias.xtask]
ci = "run --package xtask -- ci"

[build]
jobs        = 8
target      = "x86_64-unknown-linux-gnu"
target-dir  = "target"
rustflags   = ["-C", "target-cpu=native"]
incremental = true

[cache]
auto-clean-frequency = "1 day"

[cargo-new]
vcs = "git"

[credential-alias]
my-alias = ["/usr/bin/cargo-credential-example", "--argument", "value", "--flag"]

[doc]
browser = ["firefox", "--new-window"]

[env]
OPENSSL_DIR = { value = "vendor/openssl", relative = true }
RUST_LOG    = "info"
TMPDIR      = { value = "/tmp/cargo", force = true }

[future-incompat-report]
frequency = "always"

[http]
timeout      = 60
ssl-version  = { min = "tlsv1.2", max = "tlsv1.3" }
multiplexing = true
user-agent   = "my-cargo-wrapper/1.0"

[install]
root = "/opt/cargo"

[net]
retry              = 3
git-fetch-with-cli = true
offline            = false

[net.ssh]
known-hosts = ["example.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFO4Q5T0UV0SQevair9PFwoxY9dl4pQl3u5phoqJH3cF"]

[patch.crates-io]
foo = { path = "../foo" }

[profile.dev]
debug       = true
incremental = true

[profile.release]
opt-level     = 3
strip         = "symbols"
lto           = "thin"
panic         = "abort"
codegen-units = 1

[profile.release.package.image]
opt-level = 3

[registries.crates-io]
protocol = "sparse"

[registries.my-registry]
index               = "https://example.com/git/index"
credential-provider = "cargo:token"

[registry]
default                     = "my-registry"
global-credential-providers = ["cargo:token"]

[resolver]
incompatible-rust-versions = "fallback"

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[target.thumbv7m-none-eabi]
linker = "arm-none-eabi-gcc"

[target.x86_64-unknown-linux-gnu]
linker    = "clang"
runner    = ["qemu-x86_64", "-L", "/usr/x86_64-linux-gnu"]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[term]
verbose = true
color   = "always"

[term.progress]
when             = "auto"
width            = 80
term-integration = true
